networks:
  ecommerce_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

services:
  # ==========================================
  # INFRAESTRUCTURA
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5499:5432"
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6399:6379"
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "5699:5672"
      - "15699:15672"
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:4.4
    container_name: ecommerce_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27019:27017"
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==========================================
  # API GATEWAY — http://localhost:9080
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce_gateway
    ports:
      - "9080:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - campaigns-service
      - products-service
      - orders-service
      - deliveries-service
      - notifications-service
    networks:
      - ecommerce_net
    restart: unless-stopped

  # ==========================================
  # MICROSERVICIOS
  # ==========================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: ecommerce_auth
    env_file:
      - .env
    environment:
      SERVICE_NAME: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9101:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: ecommerce_users
    env_file:
      - .env
    environment:
      SERVICE_NAME: users-service
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9102:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  campaigns-service:
    build:
      context: .
      dockerfile: services/campaigns/Dockerfile
    container_name: ecommerce_campaigns
    env_file:
      - .env
    environment:
      SERVICE_NAME: campaigns-service
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9103:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  products-service:
    build:
      context: .
      dockerfile: services/products/Dockerfile
    container_name: ecommerce_products
    env_file:
      - .env
    environment:
      SERVICE_NAME: products-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9104:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    container_name: ecommerce_orders
    env_file:
      - .env
    environment:
      SERVICE_NAME: orders-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9105:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  deliveries-service:
    build:
      context: .
      dockerfile: services/deliveries/Dockerfile
    container_name: ecommerce_deliveries
    env_file:
      - .env
    environment:
      SERVICE_NAME: deliveries-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9106:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped

  notifications-service:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: ecommerce_notifications
    env_file:
      - .env
    environment:
      SERVICE_NAME: notifications-service
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9107:8000"
    networks:
      - ecommerce_net
    restart: unless-stopped