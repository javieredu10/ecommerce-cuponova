worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Usar nombre del SERVICIO del docker-compose (no container_name)
    # Docker DNS resuelve por nombre de servicio dentro de la misma red
    upstream auth_service          { server auth-service:8000; }
    upstream users_service         { server users-service:8000; }
    upstream campaigns_service     { server campaigns-service:8000; }
    upstream products_service      { server products-service:8000; }
    upstream orders_service        { server orders-service:8000; }
    upstream deliveries_service    { server deliveries-service:8000; }
    upstream notifications_service { server notifications-service:8000; }

    server {
        listen 80;
        server_name _;

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/oauth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://users_service;
            proxy_set_header Host $host;
        }

        location /api/v1/campaigns/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://campaigns_service;
            proxy_set_header Host $host;
        }

        location /api/v1/products/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://products_service;
            proxy_set_header Host $host;
        }

        location /api/v1/orders/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
        }

        location /api/v1/deliveries/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://deliveries_service;
            proxy_set_header Host $host;
        }

        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notifications_service;
            proxy_set_header Host $host;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
