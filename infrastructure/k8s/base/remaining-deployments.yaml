---
# ─── Users Service ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: ecommerce
  labels:
    app: users-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: ghcr.io/your-org/ecommerce-users:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: ecommerce-config}
            - secretRef: {name: ecommerce-secrets}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {memory: "128Mi", cpu: "100m"}
            limits: {memory: "256Mi", cpu: "300m"}
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: ecommerce
spec:
  selector:
    app: users-service
  ports:
    - port: 8000
      targetPort: 8000
