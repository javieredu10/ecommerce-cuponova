apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-prod

bases:
  - ../../base

patches:
  # Orders: 3 réplicas mínimo en producción
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: orders-service

  # Deliveries: 2 réplicas en producción
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: deliveries-service

commonLabels:
  environment: production
